name: Continous Integration Workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Python Lint Code Scanning Action
        uses: advanced-security/python-lint-code-scanning-action@v1.1.3
        with:
          linter: pylint

  discord:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Run Discord Webhook
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.build.result }}
          title: "Resultado do Workflow"
          description: "O job de build terminou com status: ${{ needs.build.result }}"
          color: 0x0000ff

  testes:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Check out repository code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.12'

        - name: Install Linter and Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install pylint fastapi

        - name: Run Pylint
          # Analisa o código e mostra os erros no log do GitHub Actions
          run: |
            pylint src/main.py --disable=C0114,C0116
