name: Continous Integration Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linter
        run: pip install pylint fastapi

      - name: Run Pylint
        run: pylint src/main.py --disable=C0114,C0116

  testes:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pytest pytest-cov

      - name: Run Tests with Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest test/test.py --cov=src --cov-report=xml

  discord:
    runs-on: ubuntu-latest
    needs: [build, testes]
    if: always()
    steps:
      - name: Run Discord Webhook
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.testes.result }}
          title: "CI Status"
          description: "Lint e Testes finalizados. Status: ${{ needs.testes.result }}"
          color: 0x0000ff