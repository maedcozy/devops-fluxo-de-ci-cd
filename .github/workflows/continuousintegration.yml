name: Continous Integration Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Python Lint Code Scanning Action
        uses: advanced-security/python-lint-code-scanning-action@v1.1.3
        with:
          linter: pylint

  testes:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pytest pytest-cov

      - name: Run Tests with Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest test/test.py --cov=src --cov-report=xml

  discord:
    runs-on: ubuntu-latest
    needs: [build, testes]
    if: always()
    steps:
      - name: Run Discord Webhook
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.testes.result }}
          title: "Resultado do Workflow CI"
          description: "Build e Testes finalizados. Status dos Testes: ${{ needs.testes.result }}"
          color: 0x0000ff